<div class="confirm-dialog__mark" aria-hidden="true">!</div>
<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
  <p class="confirm-dialog__hint">Questa azione non può essere annullata.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="confirm-dialog__cancel" mat-button type="button" [mat-dialog-close]="false">
    Annulla
  </button>
  <button
    class="confirm-dialog__confirm"
    mat-flat-button
    type="button"
    [mat-dialog-close]="true"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
